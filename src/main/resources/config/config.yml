# Initial cash for new players / 新玩家初始金额
initial-cash: 1000.0

# Currency display name / 货币显示名称
currency-name: 'Coins'

# Currency symbol prefix / 货币符号前缀
currency-symbol: '$'

# Bank settings / 银行设置
bank:
  # Enable bank feature / 启用银行功能
  enabled: true
  # Minimum deposit amount / 最低存款金额
  min-deposit: 100.0
  # Maximum bank balance (-1 = unlimited) / 最大银行余额 (-1 = 无限)
  max-balance: -1

# Interest settings / 利息设置
# Interest is paid every 1800 seconds (30 minutes), a fixed period.
# 利息每 1800 秒（30 分钟）发放一次，周期固定。
interest:
  # Pay bank interest (creates money) / 发放银行利息（会凭空产生货币）
  enabled: false
  # Interest rate per payment / 每次发放的利率
  rate: 0.03
  # Maximum interest per payment (-1 = unlimited) / 每次最大利息 (-1 = 无限)
  max-interest: 10000.0

# Leaderboard settings / 排行榜设置
# The leaderboard is refreshed every 60 seconds, a fixed period.
# 排行榜每 60 秒刷新一次，周期固定。
leaderboard:
  # Default entries shown / 默认显示数量
  display-count: 10
